# @package _global_

# Q1 CR7 Tracking reward config — v1: crouch → jump → land
# Phase 2 (future): add 180° yaw

rewards:
  set_reward: Q1_CR7_Tracking_v1
  set_reward_date: 20260607
  only_positive_rewards: False
  reward_scales:
    # Q1 CR7-specific rewards
    q1_lower_body_joint_tracking: 4.0
    q1_root_z_tracking: 6.0
    q1_root_vz_tracking: 4.0
    q1_root_yaw_tracking: 2.0
    q1_root_yaw_rate_tracking: 3.0
    q1_flight_contact: 3.0
    q1_stance_contact: 1.0
    q1_takeoff_height_progress: 2.0
    q1_landing_stability: 2.0

    # Standard teleop body tracking (inherited from parent)
    teleop_body_position_extend: 2.0
    teleop_body_position_feet: 2.0
    teleop_body_rotation_extend: 0.5
    teleop_joint_position: 1.0

    # Penalties
    penalty_action_rate: -0.03
    penalty_torques: -0.000001
    limits_torque: -0.1
    penalty_feet_ori: -0.05
    penalty_slippage: -0.05
    feet_heading_alignment: 0.0
    termination: -50.0

  teleop_body_pos_lowerbody_weight: 1.5
  teleop_body_pos_upperbody_weight: 0.8

  reward_tracking_sigma:
    teleop_upper_body_pos: 0.03
    teleop_lower_body_pos: 0.05
    teleop_feet_pos: 0.05
    teleop_body_rot: 3.0
    teleop_body_vel: 1.0
    teleop_body_ang_vel: 1.0
    teleop_joint_pos: 0.5
    teleop_joint_vel: 0.5

  reward_penalty_curriculum: False
  reward_initial_penalty_scale: 0.15
  reward_min_penalty_scale: 0.0
  reward_max_penalty_scale: 0.4
  reward_penalty_level_down_threshold: 40
  reward_penalty_level_up_threshold: 42
  reward_penalty_degree: 0.000003
  num_compute_average_epl: 10000

  reward_limit:
    soft_dof_pos_limit: 0.9
    soft_dof_vel_limit: 0.9
    soft_torque_limit: 0.9
    reward_limits_curriculum:
      soft_dof_pos_curriculum: False
      soft_dof_pos_initial_limit: 1.15
      soft_dof_pos_max_limit: 1.15
      soft_dof_pos_min_limit: 0.95
      soft_dof_pos_curriculum_degree: 0.00000025
      soft_dof_pos_curriculum_level_down_threshold: 40
      soft_dof_pos_curriculum_level_up_threshold: 42
      soft_dof_vel_curriculum: False
      soft_dof_vel_initial_limit: 1.15
      soft_dof_vel_max_limit: 1.25
      soft_dof_vel_min_limit: 0.95
      soft_dof_vel_curriculum_degree: 0.00000025
      soft_dof_vel_curriculum_level_down_threshold: 40
      soft_dof_vel_curriculum_level_up_threshold: 42
      soft_torque_curriculum: False
      soft_torque_initial_limit: 1.05
      soft_torque_max_limit: 1.15
      soft_torque_min_limit: 0.85
      soft_torque_curriculum_degree: 0.000025
      soft_torque_curriculum_level_down_threshold: 28
      soft_torque_curriculum_level_up_threshold: 42

  reward_penalty_reward_names: [
    "penalty_torques",
    "penalty_dof_acc",
    "penalty_dof_vel",
    "penalty_action_rate",
    "limits_dof_pos",
    "limits_dof_vel",
    "limits_torque",
    "feet_heading_alignment",
    "penalty_feet_ori",
    "penalty_slippage",
  ]
